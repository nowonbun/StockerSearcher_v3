name: Regression Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests PyYAML "psycopg[binary]" finance-datareader yahoo_finance_api2
      - name: Run Python regression gate
        env:
          PYTHONPATH: src
          STOCK_DB_PASSWORD: ci-test-password
        run: python -W error::ResourceWarning -m unittest tests/test_batch_runner.py tests/test_batch_process_wrapper.py tests/test_prediction_filters.py tests/test_viewer_static_contracts.py tests/test_split_dataset.py tests/test_regression_guard_contract.py -v

  viewer-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/viewer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci
      - name: Run Vitest regression gate
        run: npm test
